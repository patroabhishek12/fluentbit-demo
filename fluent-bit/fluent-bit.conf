[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf
    # Fluent Bit's own HTTP server (health + internal metrics)
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# ---------------------------------------------------------------- LOGS
# Tail JSON log files written by the apps into the shared volume.
[INPUT]
    Name              tail
    Path              /logs/*.log
    Tag               app.logs
    Path_Key          file
    Parser            json_app
    Read_from_Head    true
    Refresh_Interval  5

# Add static metadata to every record.
[FILTER]
    Name    record_modifier
    Match   app.*
    Record  env demo
    Record  collector fluent-bit

# ---------------------------------------------------------------- METRICS
# Scrape each app's /metrics endpoint.
[INPUT]
    Name             prometheus_scrape
    Host             orders
    Port             8000
    Metrics_Path     /metrics
    Scrape_Interval  5s
    Tag              metrics.orders

[INPUT]
    Name             prometheus_scrape
    Host             payments
    Port             8000
    Metrics_Path     /metrics
    Scrape_Interval  5s
    Tag              metrics.payments

# Fluent Bit's own pipeline metrics (records in/out, retries, errors...).
[INPUT]
    Name             fluentbit_metrics
    Scrape_Interval  5
    Tag              metrics.internal

# ---------------------------------------------------------------- OUTPUTS
# Logs -> Splunk HEC
[OUTPUT]
    Name              splunk
    Match             app.*
    Host              splunk
    Port              8088
    Splunk_Token      ${SPLUNK_HEC_TOKEN}
    TLS               On
    TLS.Verify        Off
    Event_Index       main
    Event_Source      fluent-bit
    Event_Sourcetype  app:json
    Retry_Limit       False

# Metrics -> Prometheus (Prometheus scrapes this endpoint on :2021)
[OUTPUT]
    Name        prometheus_exporter
    Match       metrics.*
    Host        0.0.0.0
    Port        2021
    Add_Label   collector fluent-bit

# Optional: debug to console
# [OUTPUT]
#     Name   stdout
#     Match  *
